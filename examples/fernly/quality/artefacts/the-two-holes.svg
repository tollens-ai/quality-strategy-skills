  <!-- caption: 2 sentences, opens with what the project is -->
  <text x="540" y="1216" class="disp" font-size="20" fill="#7a7259" text-anchor="middle">Fernly is a plant-care app; each leaf is one thing that matters about its quality.</text>
  <text x="540" y="1244" class="disp" font-size="20" fill="#7a7259" text-anchor="middle">Deep green is proven, drying is a known gap — and the holes are where nobody can measure, yet.</text>

