      .mono { font-family: 'Courier New', Courier, monospace; }
    </style>
    <path id="leaf" d="M0,6 C30,-12 40,-60 0,-130 C-40,-60 -30,-12 0,6 Z"/>
    <pattern id="holehatch" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#8d86a8" stroke-width="1.5" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- cream poster field -->
  <rect width="1080" height="1350" fill="#faf6ec"/>
  <rect x="26" y="26" width="1028" height="1298" fill="none" stroke="#2e5d43" stroke-width="2.5"/>

  <!-- kicker + title -->
  <text x="540" y="106" class="mono" font-size="15" letter-spacing="5" fill="#7c8a6e" text-anchor="middle">FERNLY · THE HONEST OVERVIEW, ONE LEAF PER QUESTION</text>
  <text x="540" y="186" class="disp" font-size="64" fill="#23402f" text-anchor="middle">Eleven things matter.</text>
  <text x="540" y="258" class="disp" font-size="64" font-style="italic" fill="#b8643a" text-anchor="middle">Two are holes.</text>

