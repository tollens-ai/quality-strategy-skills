<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Fernly: eleven quality dimensions drawn as leaves — two are holes nobody can measure yet">
  <title>Fernly — the two holes (derived from quality/strategy.md, 2026-06-11)</title>
  <desc>Poster of Fernly's eleven quality dimensions as leaves. Healthy green leaves are proven by tests or outside checks (schedule math, photo privacy). Paling, drying leaves are known gaps with work queued (backup restore, plant identification, payments, sensor pairing, support diagnosis). Two leaf-shaped holes — reminder delivery and household sync — mark the dimensions nobody can measure yet. The holes are exactly where users get hurt.</desc>
  <metadata id="strategy-data">{
    "project": "Fernly",
    "derivedFrom": "quality/strategy.md",
    "strategyDate": "2026-06-11",
    "view": "static overview poster — the two holes",
    "legend": {"healthy": "proven by tests or an outside check", "paling": "known gap, work queued", "hole": "nobody can measure it yet (strategy confidence: —)"},
    "leaves": [
      {"dimension": "Reminder delivery (1a)", "state": "hole", "note": "no delivery telemetry; #1 churn driver"},
      {"dimension": "Household sync (4)", "state": "hole", "note": "convergence never tested"},
      {"dimension": "Schedule math (1b)", "state": "healthy", "note": "property suite, 11 regressions caught"},
      {"dimension": "Photo privacy (8)", "state": "healthy", "note": "pen-test clean, authz suite in CI"},
      {"dimension": "Photo-backup restore (2)", "state": "paling", "note": "never rehearsed"},
      {"dimension": "Plant identification (3a)", "state": "paling", "note": "'feels fine', unmeasured (conf L)"},
      {"dimension": "Payments (5)", "state": "paling", "note": "edge paths unexercised"},
      {"dimension": "Sensor pairing (7)", "state": "paling", "note": "31% of support load"},
      {"dimension": "Support diagnosis (12)", "state": "paling", "note": "an hour per ticket"},
      {"dimension": "Offline behaviour (6)", "state": "mostly", "note": "photo queue solid, multi-day untested"},
      {"dimension": "App-store readiness (10)", "state": "mostly", "note": "crash-free 99.62%, new paywall unreviewed"}
    ]
  }</metadata>
